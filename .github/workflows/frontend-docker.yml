name: Frontend Docker Build and Push

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-docker.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/home-inventory-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write to push tag updates back to repo

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        platforms: linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update image tag in helm values
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        IMAGE_TAG="main-$(git rev-parse --short HEAD)"
        echo "Updating frontend image tag to: $IMAGE_TAG"
        sed -i "s|tag: \"main-.*\"|tag: \"$IMAGE_TAG\"|g" helm/frontend/values.yaml

    - name: Commit and push updated image tag
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add helm/frontend/values.yaml
        git diff --staged --quiet || git commit -m "Update frontend image tag to main-$(git rev-parse --short HEAD) [skip ci]"
        git pull --rebase
        git push
