name: Deploy Frontend to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'helm/frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Test kubectl connection
      run: kubectl cluster-info

    - name: Deploy with Helm
      run: |
        helm upgrade --install home-inventory-frontend ./helm/frontend \
          --namespace ${{ secrets.K8S_NAMESPACE || 'default' }} \
          --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/home-inventory-frontend \
          --set image.tag=${{ github.event.inputs.image_tag || 'latest' }} \
          --set config.apiUrl=${{ secrets.BACKEND_API_URL || 'http://home-inventory-backend:8080' }} \
          --wait \
          --timeout 5m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/home-inventory-frontend \
          -n ${{ secrets.K8S_NAMESPACE || 'default' }} \
          --timeout=5m
