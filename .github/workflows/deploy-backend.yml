name: Deploy Backend to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'helm/backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Test kubectl connection
      run: kubectl cluster-info

    - name: Deploy with Helm
      run: |
        helm upgrade --install home-inventory-backend ./helm/backend \
          --namespace ${{ secrets.K8S_NAMESPACE || 'default' }} \
          --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/home-inventory-backend \
          --set image.tag=${{ github.event.inputs.image_tag || 'latest' }} \
          --set config.postgres.host=${{ secrets.POSTGRES_HOST }} \
          --set config.postgres.port=${{ secrets.POSTGRES_PORT || '5432' }} \
          --set config.postgres.database=${{ secrets.POSTGRES_DATABASE }} \
          --set config.postgres.username=${{ secrets.POSTGRES_USERNAME }} \
          --set config.postgres.password=${{ secrets.POSTGRES_PASSWORD }} \
          --set config.openTelemetry.exporters.otlp.endpoint=${{ secrets.OTLP_ENDPOINT || 'http://otel-collector:4317' }} \
          --set "config.cors[0].allowedOrigins[0]=${{ secrets.FRONTEND_URL }}" \
          --wait \
          --timeout 5m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/home-inventory-backend \
          -n ${{ secrets.K8S_NAMESPACE || 'default' }} \
          --timeout=5m
