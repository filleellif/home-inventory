replicaCount: 1

image:
  repository: krape1987/home-inventory-frontend
  pullPolicy: IfNotPresent
  # Image tag format: main-<commit-sha>
  # Updated automatically by update-image-tags.sh script
  tag: "main-8f480fa"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: inventory.kristoffer.codes
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: inventory-kristoffer-codes-tls
      hosts:
        - inventory.kristoffer.codes

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  # Backend API URL
  apiUrl: "https://api.inventory.kristoffer.codes/api"

  # Public runtime config for Nuxt
  publicRuntimeConfig:
    apiBase: "/api"
