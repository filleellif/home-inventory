replicaCount: 1

image:
  repository: krape1987/home-inventory-backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.home-inventory.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL Operator Configuration
postgresql:
  enabled: true
  name: home-inventory-postgresql
  teamId: acid
  version: "17"
  numberOfInstances: 1
  database: home-inventory
  volume:
    size: 2Gi
    storageClass: nfs-client
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 500Mi
  maintenanceWindows: []

# Application configuration
config:
  postgres:
    host: postgres
    port: 5432
    database: homeinventory
    username: postgres
    # Password should be stored in a secret
    passwordSecretName: postgres-credentials
    passwordSecretKey: password

  cors:
    - name: AllowFrontend
      allowedOrigins:
        - "http://localhost:3000"
        - "https://localhost:3000"

  openTelemetry:
    serviceName: "HomeInventory.API"
    serviceVersion: "1.0.0"
    enableLogging: true
    enableTracing: true
    enableMetrics: false
    exporters:
      console:
        enabled: false
      otlp:
        enabled: true
        endpoint: "http://otel-collector:4317"

  fileStorage:
    rootPath: "wwwroot/uploads"
    maxFileSizeBytes: 10485760
    allowedExtensions:
      - ".jpg"
      - ".jpeg"
      - ".png"
      - ".pdf"

  logging:
    logLevel:
      default: "Information"
      microsoftAspNetCore: "Warning"
      microsoftEntityFrameworkCore: "Warning"

  allowedHosts: "*"

# Persistent volume for file storage
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/wwwroot
