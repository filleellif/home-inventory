apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-inventory-backend.fullname" . }}
  labels:
    {{- include "home-inventory-backend.labels" . | nindent 4 }}
data:
  appsettings.Production.json: |
    {
      "FileStorage": {
        "RootPath": {{ .Values.config.fileStorage.rootPath | quote }},
        "MaxFileSizeBytes": {{ .Values.config.fileStorage.maxFileSizeBytes }},
        "AllowedExtensions": {{- .Values.config.fileStorage.allowedExtensions | toJson | nindent 10 }}
      },
      "Logging": {
        "LogLevel": {
          "Default": {{ .Values.config.logging.logLevel.default | quote }},
          "Microsoft.AspNetCore": {{ .Values.config.logging.logLevel.microsoftAspNetCore | quote }},
          "Microsoft.EntityFrameworkCore": {{ .Values.config.logging.logLevel.microsoftEntityFrameworkCore | quote }}
        }
      },
      "Cors": [
        {{- range $index, $cors := .Values.config.cors }}
        {{- if $index }},{{ end }}
        {
          "Name": {{ $cors.name | quote }},
          "AllowedOrigins": {{- $cors.allowedOrigins | toJson | nindent 12 }}
        }
        {{- end }}
      ],
      "OpenTelemetry": {
        "ServiceName": {{ .Values.config.openTelemetry.serviceName | quote }},
        "ServiceVersion": {{ .Values.config.openTelemetry.serviceVersion | quote }},
        "EnableLogging": {{ .Values.config.openTelemetry.enableLogging }},
        "EnableTracing": {{ .Values.config.openTelemetry.enableTracing }},
        "EnableMetrics": {{ .Values.config.openTelemetry.enableMetrics }},
        "Exporters": {
          "Console": {
            "Enabled": {{ .Values.config.openTelemetry.exporters.console.enabled }}
          },
          "Otlp": {
            "Enabled": {{ .Values.config.openTelemetry.exporters.otlp.enabled }},
            "Endpoint": {{ .Values.config.openTelemetry.exporters.otlp.endpoint | quote }}
          }
        }
      },
      "AllowedHosts": {{ .Values.config.allowedHosts | quote }}
    }
